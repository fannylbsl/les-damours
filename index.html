<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf6f1">
  <meta name="description" content="Les d'Amours — planning partagé, menus, to-do, courses et dépenses.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='85'%3E❤️%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <title>Les d'Amours ❤️</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-script">Les d'Amours</span> <span>❤️</span></div>
      <div class="top-actions">
        <button class="icon-btn" data-action="today" aria-label="Aujourd'hui">⌂</button>
        <button class="icon-btn" data-action="settings" aria-label="Paramètres">☼</button>
      </div>
    </header>

    <main>
      <section id="view-home" class="view active"></section>
      <section id="view-week" class="view"></section>
      <section id="view-tasks" class="view"></section>
      <section id="view-shopping" class="view"></section>
      <section id="view-expenses" class="view"></section>
      <section id="view-settings" class="view"></section>
    </main>

    <nav class="bottom-nav" aria-label="Navigation principale">
      <button data-view="home" class="nav-btn active"><span>⌂</span><small>Aujourd'hui</small></button>
      <button data-view="week" class="nav-btn"><span>▦</span><small>Semaine</small></button>
      <button data-action="add" class="nav-add" aria-label="Ajouter">＋</button>
      <button data-view="tasks" class="nav-btn"><span>✓</span><small>To-do</small></button>
      <button data-view="shopping" class="nav-btn"><span>🛒</span><small>Courses</small></button>
      <button data-view="expenses" class="nav-btn"><span>€</span><small>Dépenses</small></button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
